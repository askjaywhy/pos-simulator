# CI for the core simulator: guard self-tests + the Playwright ready suite on Linux.
# The Java lab suite needs the Docker lab and is not run here.
#
# Notes
# - SIM_NOW is deliberately NOT set: expiry-date.spec.js builds "this month" and
#   "last month" from the real clock, and the backend must agree with it.
# - --retries=0 overrides the config's CI retries so a flaky or real failure is never
#   hidden by a rerun (same rule as the agent guard).
# - --ignore-snapshots: the only visual baseline is Windows-rendered
#   (terminal-empty-chromium-win32.png); add a Linux baseline before enforcing it here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Guard self-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run guard + shell-guard self-tests
        working-directory: tests
        run: npm run test:guard

  playwright:
    name: Playwright ready suite (API + UI)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            tests/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install test dependencies
        working-directory: tests
        run: npm ci

      - name: Install Chromium
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Start backend (:3001) and terminal UI (:3000)
        run: |
          (cd backend && node server.js > ../backend.log 2>&1 &)
          (node scripts/serve-ui.js > ui.log 2>&1 &)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/api/health > /dev/null && curl -sf http://localhost:3000 > /dev/null; then
              echo "Both servers up"; exit 0
            fi
            sleep 1
          done
          echo "Servers did not start"; cat backend.log ui.log; exit 1

      - name: Run ready suite
        working-directory: tests
        run: npx playwright test -c playwright.ready.config.js --retries=0 --ignore-snapshots

      - name: Server logs
        if: always()
        run: cat backend.log ui.log || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 14
